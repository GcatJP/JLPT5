<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Missing Word" />

    <title>Missing Word Grammar Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Comic Neue", "Chalkboard SE", "Chalkboard", "Comic Sans MS",
          "Segoe Print", sans-serif;
        --colour-btn-face: blue;
        --colour-btn-active: blue;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-correct: #4caf50;
        --colour-wrong: #e53935;
        --colour-dim: #f0f0f0;
        --colour-option-btn: #fff3d6;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: blue;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: lightskyblue;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px yellow;
        font-size: clamp(1.4rem, 7vw, 3rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.2rem, 5.5vw, 1.9rem);
        text-align: center;
      }

      .start-sub {
        color: white;
        opacity: 0.9;
        font-size: clamp(0.85rem, 3.6vw, 1.1rem);
        text-align: center;
        max-width: 420px;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .start-buttons .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        height: clamp(56px, 11vh, 90px);
        font-size: clamp(1.2rem, 6vw, 2rem);
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }
      .start-buttons .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 1.2em 1.2em;
        margin-bottom: 3vh;
        text-align: center;
        width: 100%;
        max-width: 560px;
      }
      .question-label {
        font-family: var(--font-chalk);
        font-size: clamp(0.75rem, 3vw, 0.95rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #999;
        margin-bottom: 0.5em;
      }
      .question-sentence {
        font-size: clamp(1.15rem, 5.4vw, 1.9rem);
        color: #222;
        font-family: var(--font-chalk);
        line-height: 1.5;
      }
      .question-sentence .blank {
        display: inline-block;
        min-width: 2.4em;
        border-bottom: 3px solid #333;
        margin: 0 0.1em;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 3vw, 16px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-option-btn);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
        font-size: clamp(1rem, 5vw, 1.5rem);
        min-height: clamp(52px, 9vh, 76px);
        padding: 0.3em 0.8em;
        text-align: center;
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

      /* RESULTS SCREEN */
      .results-wrapper {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
        overflow-y: auto;
      }

      .score {
        color: white;
        -webkit-text-stroke: 1.5px darkorange;
        font-size: clamp(2rem, 10vw, 4rem);
        text-align: center;
        margin-bottom: 0.3em;
      }

      .score-sub {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

      .mistakes-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.7em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        font-size: clamp(0.9rem, 3.6vw, 1.15rem);
      }

      .mistakes-list .sentence {
        font-weight: bold;
      }

      .mistakes-list .verdict {
        color: var(--colour-correct);
        font-weight: bold;
      }
      .mistakes-list .your-answer {
        color: var(--colour-wrong);
      }

      .play-again {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        transition: transform 0.1s ease;
      }
      .play-again:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE IPHONE - ask to rotate */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        h1,
        .progress,
        .start-wrapper,
        .game-wrapper,
        .results-wrapper,
        .back-btn {
          display: none;
        }
      }

      /* PORTRAIT IPHONE tweaks */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 8vw, 2.1rem) !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }
        .game-wrapper {
          padding: 1vh 6vw 3vh;
        }
        .question-card {
          margin-bottom: 2.5vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <a class="back-btn" href="grammar.html">← Back</a>
    <h1>Missing Word</h1>
    <div class="progress" id="progress" style="display: none">
      Question 1 / 20
    </div>

    <div class="start-wrapper" id="startWrapper">
      <div class="start-title">Missing Word Quiz</div>
      <div class="start-sub">
        Read each sentence. Choose the correct word to fill the blank.
      </div>
      <div class="start-buttons">
        <button class="btn" data-count="10">10</button>
        <button class="btn" data-count="20">20</button>
        <button class="btn" data-count="30">30</button>
      </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none">
      <div class="question-card">
        <div class="question-label">Choose the correct word</div>
        <div class="question-sentence" id="questionSentence"></div>
      </div>
      <div class="options" id="options"></div>
    </div>

    <div class="results-wrapper" id="resultsWrapper" style="display: none">
      <div class="score" id="score"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="mistakes-title" id="mistakesTitle" style="display: none">
        Sentences to review
      </div>
      <ul class="mistakes-list" id="mistakesList"></ul>
      <button class="play-again" id="playAgainBtn">Play Again</button>
    </div>

    <script>
      // ---- Missing Word bank: 250 questions based on A2 Grammar List ----
      const MISSING_WORD_BANK = [
        // 1. ちゃいけない - must not do (spoken)
        {
          text: "ここでは写真を撮っ___。(You must not take photos here.)",
          options: ["ちゃいけない", "たい", "てください"],
          answer: "ちゃいけない",
        },
        // 2. だ・です - to be
        {
          text: "明日は休み___。(Tomorrow is a day off.)",
          options: ["です", "が", "でも"],
          answer: "です",
        },
        // 3. だけ - only
        {
          text: "テストに一つ___質問があります。(I have only one question about the test.)",
          options: ["だけ", "でも", "まで"],
          answer: "だけ",
        },
        // 4. だろう - probably (plain)
        {
          text: "彼はもう寝ている___。(He's probably already asleep.)",
          options: ["だろう", "でしょう", "でした"],
          answer: "だろう",
        },
        // 5. で - in/at/on/by/with/via
        {
          text: "駅___友達に会いました。(I met my friend at the station.)",
          options: ["で", "に", "を"],
          answer: "で",
        },
        // 6. でも - but/however
        {
          text: "疲れました。___、頑張ります。(I'm tired. But I'll do my best.)",
          options: ["でも", "それから", "そして"],
          answer: "でも",
        },
        // 7. でしょう - probably (polite)
        {
          text: "来週は忙しい___。(Next week will probably be busy.)",
          options: ["でしょう", "だろう", "ました"],
          answer: "でしょう",
        },
        // 8. どんな - what kind of
        {
          text: "___スポーツが好きですか。(What kind of sports do you like?)",
          options: ["どんな", "どうして", "どうやって"],
          answer: "どんな",
        },
        // 9. どうして - why
        {
          text: "___日本語を勉強していますか。(Why are you studying Japanese?)",
          options: ["どうして", "どんな", "どうやって"],
          answer: "どうして",
        },
        // 10. どうやって - how
        {
          text: "___漢字を覚えますか。(How do you memorize kanji?)",
          options: ["どうやって", "どうして", "どんな"],
          answer: "どうやって",
        },
        // 11. が - subject marker
        {
          text: "だれ___来ましたか。(Who came?)",
          options: ["が", "は", "を"],
          answer: "が",
        },
        // 12. があります - there is (things)
        {
          text: "机の上に本___。(There is a book on the desk.)",
          options: ["があります", "がいます", "がほしい"],
          answer: "があります",
        },
        // 13. がほしい - to want something
        {
          text: "新しい靴___。(I want new shoes.)",
          options: ["がほしい", "があります", "がいます"],
          answer: "がほしい",
        },
        // 14. がいます - there is (living things)
        {
          text: "公園に子供___。(There are children in the park.)",
          options: ["がいます", "があります", "がほしい"],
          answer: "がいます",
        },
        // 15. ほうがいい - had better
        {
          text: "薬を飲んだ___です。(You'd better take medicine.)",
          options: ["ほうがいい", "たい", "つもり"],
          answer: "ほうがいい",
        },
        // 16. い-adjectives
        {
          text: "「大きい」はどんな形容詞ですか。(What kind of adjective is 大きい?)",
          options: ["い-adjective", "な-adjective", "noun"],
          answer: "い-adjective",
        },
        // 17. 一番 - the most
        {
          text: "クラスで彼女が___頭がいいです。(She is the smartest in the class.)",
          options: ["一番", "一緒に", "いつも"],
          answer: "一番",
        },
        // 18. 一緒に - together
        {
          text: "週末、家族と___旅行します。(I'll travel together with my family this weekend.)",
          options: ["一緒に", "一番", "いつも"],
          answer: "一緒に",
        },
        // 19. いつも - always
        {
          text: "父は___朝早く起きます。(My father always wakes up early in the morning.)",
          options: ["いつも", "一番", "もう"],
          answer: "いつも",
        },
        // 20. じゃない - to not be
        {
          text: "これはペン___。(This is not a pen.)",
          options: ["じゃない", "です", "が"],
          answer: "じゃない",
        },
        // 21. か - question particle
        {
          text: "明日は雨です___。(Will it rain tomorrow?)",
          options: ["か", "ね", "よ"],
          answer: "か",
        },
        // 22. か～か - or
        {
          text: "電車___バス___、どちらで行きますか。(Will you go by train or bus?)",
          options: ["か～か", "と", "や"],
          answer: "か～か",
        },
        // 23. から - because/since/from
        {
          text: "眠い___、早く寝ます。(Because I'm sleepy, I'll sleep early.)",
          options: ["から", "ので", "けど"],
          answer: "から",
        },
        // 24. 方 - way of doing
        {
          text: "この漢字の読み___が分かりません。(I don't know how to read this kanji.)",
          options: ["方", "から", "つもり"],
          answer: "方",
        },
        // 25. けど - but (casual)
        {
          text: "食べたい___、お金がありません。(I want to eat, but I don't have money.)",
          options: ["けど", "から", "ので"],
          answer: "けど",
        },
        // 26. けれども - but (formal)
        {
          text: "この部屋は狭い___、静かです。(This room is small, but it's quiet.)",
          options: ["けれども", "でも", "から"],
          answer: "けれども",
        },
        // 27. まだ - still/not yet
        {
          text: "宿題は___終わっていません。(I still haven't finished the homework.)",
          options: ["まだ", "もう", "すぐ"],
          answer: "まだ",
        },
        // 28. まだ～ていません - have not yet
        {
          text: "彼女はまだ手紙を書い___。(She still hasn't written the letter.)",
          options: ["ていません", "ています", "でした"],
          answer: "ていません",
        },
        // 29. まで - until/as far as
        {
          text: "図書館は九時___開いています。(The library is open until 9 o'clock.)",
          options: ["まで", "から", "だけ"],
          answer: "まで",
        },
        // 30. 前に - before
        {
          text: "寝る___、歯を磨きます。(Before sleeping, I brush my teeth.)",
          options: ["前に", "から", "まで"],
          answer: "前に",
        },
        // 31. ませんか - would you / shall we
        {
          text: "一緒に映画を見___。(Would you like to watch a movie together?)",
          options: ["ませんか", "ましょう", "たいです"],
          answer: "ませんか",
        },
        // 32. ましょう - let's
        {
          text: "もう遅いので、帰り___。(It's late, so let's go home.)",
          options: ["ましょう", "ませんか", "ましょうか"],
          answer: "ましょう",
        },
        // 33. ましょうか - shall I
        {
          text: "荷物を持ち___。(Shall I carry your luggage?)",
          options: ["ましょうか", "ましょう", "ませんか"],
          answer: "ましょうか",
        },
        // 34. も - too/also
        {
          text: "私はコーヒーが好きです。紅茶___好きです。(I like coffee. I also like tea.)",
          options: ["も", "は", "だけ"],
          answer: "も",
        },
        // 35. もう - already
        {
          text: "宿題は___終わりました。(I already finished the homework.)",
          options: ["もう", "まだ", "いつも"],
          answer: "もう",
        },
        // 36. な-adjectives
        {
          text: "「静か」はどんな形容詞ですか。(What kind of adjective is 静か?)",
          options: ["な-adjective", "い-adjective", "noun"],
          answer: "な-adjective",
        },
        // 37. なあ - confirmation/admiration
        {
          text: "きれいな景色だ___。(What a beautiful view!)",
          options: ["なあ", "ね", "よ"],
          answer: "なあ",
        },
        // 38. ないで - without doing
        {
          text: "傘を持た___出かけました。(I went out without bringing an umbrella.)",
          options: ["ないで", "てから", "たり"],
          answer: "ないで",
        },
        // 39. ないでください - please don't do
        {
          text: "ここに車を止め___。(Please don't park your car here.)",
          options: ["ないでください", "てください", "たいです"],
          answer: "ないでください",
        },
        // 40. ないといけない - must do
        {
          text: "薬を飲ま___。(I have to take medicine.)",
          options: ["ないといけない", "なくてもいい", "たことがある"],
          answer: "ないといけない",
        },
        // 41. なくてもいい - don't have to
        {
          text: "今日は仕事をし___。(You don't have to work today.)",
          options: ["なくてもいい", "ないといけない", "なくちゃ"],
          answer: "なくてもいい",
        },
        // 42. なくちゃ - gotta do (casual)
        {
          text: "もう帰ら___。(I've gotta go home now.)",
          options: ["なくちゃ", "なくてもいい", "たい"],
          answer: "なくちゃ",
        },
        // 43. なくてはいけない - must do
        {
          text: "レポートを書か___。(I must write the report.)",
          options: ["なくてはいけない", "なくてもいい", "たことがある"],
          answer: "なくてはいけない",
        },
        // 44. なくてはならない - must do
        {
          text: "規則を守ら___。(One must follow the rules.)",
          options: ["なくてはならない", "なくてもいい", "てもいいです"],
          answer: "なくてはならない",
        },
        // 45. なる - to become
        {
          text: "寒く___きました。(It has gotten cold.)",
          options: ["なって", "して", "あって"],
          answer: "なって",
        },
        // 46. んです - to explain/emphasize
        {
          text: "どうして遅れた___か。(explaining: Why were you late?)",
          options: ["んです", "です", "ます"],
          answer: "んです",
        },
        // 47. ね - isn't it? right?
        {
          text: "今日はいい天気です___。(It's nice weather today, isn't it?)",
          options: ["ね", "よ", "か"],
          answer: "ね",
        },
        // 48. に - destination/time particle
        {
          text: "明日、東京___行きます。(Tomorrow I will go to Tokyo.)",
          options: ["に", "で", "を"],
          answer: "に",
        },
        // 49. にいく - go to do
        {
          text: "映画を見___。(I'm going to see a movie.)",
          options: ["にいく", "にする", "がほしい"],
          answer: "にいく",
        },
        // 50. にする - to decide on
        {
          text: "飲み物は紅茶___。(I'll decide on tea for the drink.)",
          options: ["にする", "にいく", "ほうがいい"],
          answer: "にする",
        },
        // 51. に/へ - to (direction)
        {
          text: "北海道___旅行します。(I will travel to Hokkaido.)",
          options: ["へ", "で", "を"],
          answer: "へ",
        },
        // 52. の - possessive particle
        {
          text: "これは私___本です。(This is my book.)",
          options: ["の", "が", "を"],
          answer: "の",
        },
        // 53. のです - to explain/emphasize
        {
          text: "電車が遅れた___。(explaining: The train was delayed.)",
          options: ["のです", "んです", "でしょう"],
          answer: "のです",
        },
        // 54. のが下手 - to be bad at
        {
          text: "私は歌う___です。(I'm bad at singing.)",
          options: ["のが下手", "のが上手", "のが好き"],
          answer: "のが下手",
        },
        // 55. のが上手 - to be good at
        {
          text: "彼はテニスをする___です。(He's good at playing tennis.)",
          options: ["のが上手", "のが下手", "のが好き"],
          answer: "のが上手",
        },
        // 56. のが好き - to like doing something
        {
          text: "私は本を読む___です。(I like reading books.)",
          options: ["のが好き", "のが上手", "のが下手"],
          answer: "のが好き",
        },
        // 57. の中で[A]が一番 - out of this group, A is best
        {
          text: "スポーツの中でサッカー___好きです。(Among sports, I like soccer the best.)",
          options: ["が一番", "だけ", "でも"],
          answer: "が一番",
        },
        // 58. ので - because of/since
        {
          text: "疲れた___、早く寝ます。(Because I'm tired, I'll sleep early.)",
          options: ["ので", "だけ", "でも"],
          answer: "ので",
        },
        // 59. お / ご - polite/honorific prefix
        {
          text: "___名前を教えてください。(Please tell me your name.)",
          options: ["お", "を", "が"],
          answer: "お",
        },
        // 60. を - object marker
        {
          text: "パン___食べます。(I eat bread.)",
          options: ["を", "が", "に"],
          answer: "を",
        },
        // 61. をください - please give me
        {
          text: "水___。(Please give me water.)",
          options: ["をください", "がほしい", "でしょう"],
          answer: "をください",
        },
        // 62. しかし - but/however
        {
          text: "頑張りました。___、負けました。(I tried hard. However, I lost.)",
          options: ["しかし", "それから", "そして"],
          answer: "しかし",
        },
        // 63. それから - and then/after that
        {
          text: "宿題をしました。___、テレビを見ました。(I did homework. After that, I watched TV.)",
          options: ["それから", "しかし", "でも"],
          answer: "それから",
        },
        // 64. そして - and then/thus
        {
          text: "朝ご飯を食べました。___、学校へ行きました。(I ate breakfast. And then I went to school.)",
          options: ["そして", "しかし", "でも"],
          answer: "そして",
        },
        // 65. すぎる - too much
        {
          text: "このケーキは甘___。(This cake is too sweet.)",
          options: ["すぎる", "だけ", "でも"],
          answer: "すぎる",
        },
        // 66. たことがある - to have done something before
        {
          text: "京都へ行っ___。(I have been to Kyoto before.)",
          options: ["たことがある", "たほうがいい", "たいです"],
          answer: "たことがある",
        },
        // 67. たい - want to do
        {
          text: "水が飲み___。(I want to drink water.)",
          options: ["たい", "たことがある", "たほうがいい"],
          answer: "たい",
        },
        // 68. たり～たり - do such things as A and B
        {
          text: "週末は掃除をし___、買い物をしたりします。(On weekends, I do things like cleaning and shopping.)",
          options: ["たり", "から", "ので"],
          answer: "たり",
        },
        // 69. てある - is/has been done (resulting state)
        {
          text: "壁に絵が掛け___。(A picture is hung on the wall.)",
          options: ["てある", "ている", "てください"],
          answer: "てある",
        },
        // 70. ている - ongoing action/current state
        {
          text: "今、雨が降っ___。(It is raining now.)",
          options: ["ている", "てある", "てから"],
          answer: "ている",
        },
        // 71. てから - after doing
        {
          text: "手を洗っ___、食べます。(After washing my hands, I eat.)",
          options: ["てから", "てある", "ている"],
          answer: "てから",
        },
        // 72. てください - please do
        {
          text: "ここに名前を書い___。(Please write your name here.)",
          options: ["てください", "ないでください", "てもいいです"],
          answer: "てください",
        },
        // 73. てはいけない - must not
        {
          text: "ここで走っ___。(You must not run here.)",
          options: ["てはいけない", "てもいいです", "てください"],
          answer: "てはいけない",
        },
        // 74. てもいいです - is OK to
        {
          text: "写真を撮っ___か。(Is it OK to take a photo?)",
          options: ["てもいいです", "てはいけません", "ないでください"],
          answer: "てもいいです",
        },
        // 75. と - and/with/as
        {
          text: "友達___映画を見ます。(I watch a movie with my friend.)",
          options: ["と", "や", "か"],
          answer: "と",
        },
        // 76. とき - when
        {
          text: "日本へ行く___、パスポートが必要です。(When you go to Japan, you need a passport.)",
          options: ["とき", "前に", "から"],
          answer: "とき",
        },
        // 77. とても - very
        {
          text: "この本は___面白いです。(This book is very interesting.)",
          options: ["とても", "一番", "もう"],
          answer: "とても",
        },
        // 78. つもり - plan to/intend to
        {
          text: "来年、留学する___です。(I plan to study abroad next year.)",
          options: ["つもり", "ほうがいい", "たい"],
          answer: "つもり",
        },
        // 79. は - topic marker
        {
          text: "私___学生です。(I am a student.)",
          options: ["は", "が", "を"],
          answer: "は",
        },
        // 80. は〜より・・・です - A is more ~ than B
        {
          text: "象はねずみ___大きいです。(An elephant is bigger than a mouse.)",
          options: ["より", "から", "まで"],
          answer: "より",
        },
        // 81. はどうですか - how about
        {
          text: "コーヒーは___。(How about coffee?)",
          options: ["はどうですか", "をください", "がほしい"],
          answer: "はどうですか",
        },
        // 82. や - and/or (partial listing)
        {
          text: "机の上に本___ペンがあります。(There are things like books and pens on the desk.)",
          options: ["や", "と", "か"],
          answer: "や",
        },
        // 83. よ - emphasis (ending particle)
        {
          text: "もうすぐ電車が来ます___。(The train is coming soon, you know!)",
          options: ["よ", "ね", "か"],
          answer: "よ",
        },
        // 84. より～ほうが - A is more than B
        {
          text: "電車___バスのほうが速いです。(The bus is faster than the train.)",
          options: ["より", "から", "まで"],
          answer: "より",
        },
      ];
      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionSentenceEl = document.getElementById("questionSentence");
      const optionsEl = document.getElementById("options");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame() {
        questions = shuffle(MISSING_WORD_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;

        questionSentenceEl.innerHTML = q.text.replace(
          "___",
          '<span class="blank">&nbsp;</span>',
        );

        optionsEl.innerHTML = "";
        const shuffledOptions = shuffle(q.options);
        shuffledOptions.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => handleAnswer(opt, btn));
          optionsEl.appendChild(btn);
        });
      }

      function handleAnswer(chosen, chosenBtn) {
        const q = questions[currentIndex];
        const allBtns = optionsEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrectAnswer = chosen === q.answer;

        allBtns.forEach((b) => {
          if (b.textContent === q.answer) {
            b.classList.add("correct");
          } else if (b === chosenBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrectAnswer) {
          score++;
        } else {
          wrongAnswers.push({
            text: q.text,
            answer: q.answer,
            chosen: chosen,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }

      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const sentSpan = document.createElement("span");
            sentSpan.className = "sentence";
            sentSpan.textContent = w.text.replace("___", "_____");
            const yourSpan = document.createElement("span");
            yourSpan.className = "your-answer";
            yourSpan.textContent = "You chose: " + w.chosen;
            const verdictSpan = document.createElement("span");
            verdictSpan.className = "verdict";
            verdictSpan.textContent = "Correct answer: " + w.answer;
            li.appendChild(sentSpan);
            li.appendChild(yourSpan);
            li.appendChild(verdictSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
</html>
