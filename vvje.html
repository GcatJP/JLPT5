<html lang="en">
  <head>

    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

      name="apple-mobile-web-app-status-bar-style"

    <title>Vocabulary Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />

      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        --font-jp:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        --colour-btn-face: blue;
        --colour-btn-active: blue;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-correct: #4caf50;
        --colour-wrong: #e53935;
        --colour-dim: #f0f0f0;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: blue;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: lightskyblue;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
        font-size: clamp(1.5rem, 8vw, 3.5rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.3rem, 6vw, 2rem);
        text-align: center;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 0.8em 1em;
        margin-bottom: 4vh;
        text-align: center;
        width: 100%;
        max-width: 480px;
      }
      .question-jp {
        font-size: clamp(2rem, 11vw, 4.5rem);
        color: #333;
        font-family: var(--font-jp);
        line-height: 1.3;
      }

      .answers {
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 4vw, 24px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
        font-size: clamp(1.1rem, 6vw, 2rem);
        height: clamp(60px, 12vh, 100px);
        padding: 0 0.6em;
      }
      .answers .btn {
        font-family: var(--font-jp);
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

      /* RESULTS SCREEN */
      .results-wrapper {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
        overflow-y: auto;
      }

      .score {
        color: white;
        -webkit-text-stroke: 1.5px darkorange;
        font-size: clamp(2rem, 10vw, 4rem);
        text-align: center;
        margin-bottom: 0.3em;
      }

      .score-sub {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

      .mistakes-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.6em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1em;
        font-size: clamp(0.95rem, 4vw, 1.3rem);
      }

      .mistakes-list .jp {
        font-weight: bold;
        font-family: var(--font-jp);
      }

      .mistakes-list .en {
        color: var(--colour-wrong);
        font-weight: bold;
        text-align: right;
      }

      .play-again {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        transition: transform 0.1s ease;
      }
      .play-again:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE IPHONE - ask to rotate */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        h1,
        .progress,
        .start-wrapper,
        .game-wrapper,
        .results-wrapper,
        .back-btn {
          display: none;
        }
      }

      /* PORTRAIT IPHONE tweaks */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.3rem, 9vw, 2.4rem) !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }
        .game-wrapper {
          padding: 1vh 6vw 3vh;
        }
        .question-card {
          margin-bottom: 3vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <a class="back-btn" href="vv.html">← Back</a>
    <h1>Verbs Quiz</h1>
    <div class="progress" id="progress" style="display: none">
      Question 1 / 20
    </div>

    <div class="start-wrapper" id="startWrapper">
      <div class="start-title">How many questions?</div>
      <div class="start-buttons">
        <button class="btn" data-count="20">20</button>
        <button class="btn" data-count="30">30</button>
        <button class="btn" data-count="40">40</button>
      </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none">
      <div class="question-card">
        <div class="question-jp" id="questionJp"></div>
      </div>
      <div class="answers" id="answers"></div>
    </div>

    <div class="results-wrapper" id="resultsWrapper" style="display: none">
      <div class="score" id="score"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="mistakes-title" id="mistakesTitle" style="display: none">
        Words to review
      </div>
      <ul class="mistakes-list" id="mistakesList"></ul>
      <button class="play-again" id="playAgainBtn">Play Again</button>
    </div>

    <script>
      // ---- Noun bank: English noun + Japanese meaning ----
      const VERB_BANK = [
        { en: "meet", jp: "会う" },
        { en: "open", jp: "開ける" },
        { en: "play", jp: "遊ぶ" },
        { en: "take a shower", jp: "浴びる" },
        { en: "wash", jp: "洗う" },
        { en: "exist (thing)", jp: "ある" },
        { en: "walk", jp: "歩く" },
        { en: "say", jp: "言う" },
        { en: "go", jp: "行く" },
        { en: "exist (person/animal)", jp: "いる" },
        { en: "put in", jp: "入れる" },
        { en: "sing", jp: "歌う" },
        { en: "be born", jp: "生まれる" },
        { en: "sell", jp: "売る" },
        { en: "get up", jp: "起きる" },
        { en: "put/place", jp: "置く" },
        { en: "teach", jp: "教える" },
        { en: "swim", jp: "泳ぐ" },
        { en: "get off", jp: "降りる" },
        { en: "finish", jp: "終わる" },
        { en: "buy", jp: "買う" },
        { en: "return something", jp: "返す" },
        { en: "take (time/money)", jp: "かかる" },
        { en: "write", jp: "書く" },
        { en: "make a call", jp: "かける" },
        { en: "lend", jp: "貸す" },
        { en: "wear (on head)", jp: "かぶる" },
        { en: "borrow", jp: "借りる" },
        { en: "listen/ask", jp: "聞く" },
        { en: "cut", jp: "切る" },
        { en: "wear (clothes)", jp: "着る" },
        { en: "come", jp: "来る" },
        { en: "turn off/erase", jp: "消す" },
        { en: "answer", jp: "答える" },
        { en: "look for", jp: "探す" },
        { en: "hold up (umbrella)", jp: "差す" },
        { en: "close", jp: "閉める" },
        { en: "know", jp: "知る" },
        { en: "do", jp: "する" },
        { en: "sit", jp: "座る" },
        { en: "take out/submit", jp: "出す" },
        { en: "stand", jp: "立つ" },
        { en: "ask/request", jp: "頼む" },
        { en: "eat", jp: "食べる" },
        { en: "use", jp: "使う" },
        { en: "make", jp: "作る" },
        { en: "work for", jp: "勤める" },
        { en: "go out/leave", jp: "出る" },
        { en: "help", jp: "手伝う" },
        { en: "stop", jp: "止まる" },
        { en: "take", jp: "取る" },
        { en: "cry", jp: "泣く" },
        { en: "become", jp: "なる" },
        { en: "learn", jp: "習う" },
        { en: "drink", jp: "飲む" },
        { en: "ride", jp: "乗る" },
        { en: "enter", jp: "入る" },
        { en: "carry", jp: "運ぶ" },
        { en: "begin", jp: "始まる" },
        { en: "speak", jp: "話す" },
        { en: "work", jp: "働く" },
        { en: "run", jp: "走る" },
        { en: "play (instrument)", jp: "弾く" },
        { en: "blow", jp: "吹く" },
        { en: "fall (rain/snow)", jp: "降る" },
        { en: "turn", jp: "曲がる" },
        { en: "wait", jp: "待つ" },
        { en: "see/watch", jp: "見る" },
        { en: "show", jp: "見せる" },
        { en: "hold/have", jp: "持つ" },
        { en: "rest", jp: "休む" },
        { en: "call", jp: "呼ぶ" },
        { en: "read", jp: "読む" },
        { en: "understand", jp: "分かる" },
        { en: "forget", jp: "忘れる" },
        { en: "laugh", jp: "笑う" },
      ];

      let QUESTIONS_PER_GAME = 20; // now variable, set by start-screen buttons

      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionJpEl = document.getElementById("questionJp");
      const answersEl = document.getElementById("answers");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame() {
        questions = shuffle(VERB_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;
        questionJpEl.textContent = q.jp; // changed from q.jp

        const distractorPool = VERB_BANK.filter((v) => v.en !== q.en);
        const distractors = shuffle(distractorPool).slice(0, 2);
        const options = shuffle([q, ...distractors]);

        answersEl.innerHTML = "";
        options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt.en; // changed from opt.en
          btn.addEventListener("click", () => handleAnswer(opt, q, btn));
          answersEl.appendChild(btn);
        });
      }

      function handleAnswer(selected, correctQ, clickedBtn) {
        const allBtns = answersEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrect = selected.en === correctQ.en;

        allBtns.forEach((b) => {
          if (b.textContent === correctQ.en) {
            b.classList.add("correct");
          } else if (b === clickedBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrect) {
          score++;
        } else {
          wrongAnswers.push({
            jp: correctQ.jp,
            correct: correctQ.en,
            chosen: selected.en,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }
      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const jpSpan = document.createElement("span");
            jpSpan.className = "jp";
            jpSpan.textContent = w.jp;
            const enSpan = document.createElement("span");
            enSpan.className = "en";
            enSpan.textContent = w.correct;
            li.appendChild(jpSpan);
            li.appendChild(enSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
</html>
