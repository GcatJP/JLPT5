    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        --font-jp:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        --colour-btn-face: blue;
        --colour-btn-active: blue;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-correct: #4caf50;
        --colour-wrong: #e53935;
        --colour-dim: #f0f0f0;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: blue;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: lightskyblue;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
        font-size: clamp(1.5rem, 8vw, 3.5rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.3rem, 6vw, 2rem);
        text-align: center;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 0.8em 1em;
        margin-bottom: 4vh;
        text-align: center;
        width: 100%;
        max-width: 480px;
      }
      .question-jp {
        font-size: clamp(2rem, 11vw, 4.5rem);
        color: #333;
        font-family: var(--font-chalk);
        line-height: 1.3;
      }

      .answers {
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 4vw, 24px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
        font-size: clamp(1.1rem, 6vw, 2rem);
        height: clamp(60px, 12vh, 100px);
        padding: 0 0.6em;
      }
      .answers .btn {
        font-family: var(--font-jp);
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

      /* RESULTS SCREEN */
      .results-wrapper {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
        overflow-y: auto;
      }

      .score {
        color: white;
        -webkit-text-stroke: 1.5px darkorange;
        font-size: clamp(2rem, 10vw, 4rem);
        text-align: center;
        margin-bottom: 0.3em;
      }

      .score-sub {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

      .mistakes-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.6em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1em;
        font-size: clamp(0.95rem, 4vw, 1.3rem);
      }

      .mistakes-list .jp {
        font-weight: bold;
        font-family: var(--font-jp);
      }

      .mistakes-list .en {
        color: var(--colour-wrong);
        font-weight: bold;
        text-align: right;
      }

      .play-again {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        transition: transform 0.1s ease;
      }
      .play-again:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE IPHONE - ask to rotate */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        h1,
        .progress,
        .start-wrapper,
        .game-wrapper,
        .results-wrapper,
        .back-btn {
          display: none;
        }
      }

      /* PORTRAIT IPHONE tweaks */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.3rem, 9vw, 2.4rem) !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }
        .game-wrapper {
          padding: 1vh 6vw 3vh;
        }
        .question-card {
          margin-bottom: 3vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <a class="back-btn" href="va.html">← Back</a>
    <h1>Adjectives Quiz</h1>
    <div class="progress" id="progress" style="display: none">
      Question 1 / 20
    </div>

    <div class="start-wrapper" id="startWrapper">
      <div class="start-title">How many questions?</div>
      <div class="start-buttons">
        <button class="btn" data-count="20">20</button>
        <button class="btn" data-count="40">40</button>
        <button class="btn" data-count="all">All</button>
        <button class="btn" id="resetProgressBtn" style="margin-top: 12px">
          Reset Progress
        </button>
      </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none">
      <div class="question-card">
        <div class="question-jp" id="questionJp"></div>
      </div>
      <div class="answers" id="answers"></div>
    </div>

    <div class="results-wrapper" id="resultsWrapper" style="display: none">
      <div class="score" id="score"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="mistakes-title" id="mistakesTitle" style="display: none">
        Words to review
      </div>
      <ul class="mistakes-list" id="mistakesList"></ul>
      <button class="play-again" id="playAgainBtn">Play Again</button>
    </div>

    <script>
      // ---- Noun bank: English noun + Japanese meaning ----
      const VERB_BANK = [
        // い-adjectives
        { en: "dangerous", jp: "危ない（あぶない）" },
        { en: "red", jp: "赤い（あかい）" },
        { en: "bright", jp: "明るい（あかるい）" },
        { en: "sweet", jp: "甘い（あまい）" },
        { en: "blue", jp: "青い（あおい）" },
        { en: "new", jp: "新しい（あたらしい）" },
        { en: "warm", jp: "暖かい（あたたかい）" },
        { en: "thick", jp: "厚い（あつい）" },
        { en: "hot (weather)", jp: "暑い（あつい）" },
        { en: "hot (to touch)", jp: "熱い（あつい）" },
        { en: "small", jp: "小さい（ちいさい）" },
        { en: "near/close", jp: "近い（ちかい）" },
        { en: "old (things)", jp: "古い（ふるい）" },
        { en: "fat/thick", jp: "太い（ふとい）" },
        { en: "fast/early", jp: "早い（はやい）" },
        { en: "fast/quick", jp: "速い（はやい）" },
        { en: "short/low", jp: "低い（ひくい）" },
        { en: "spacious/wide", jp: "広い（ひろい）" },
        { en: "want", jp: "欲しい（ほしい）" },
        { en: "thin/slender", jp: "細い（ほそい）" },
        { en: "busy", jp: "忙しい（いそがしい）" },
        { en: "painful/sore", jp: "痛い（いたい）" },
        { en: "spicy", jp: "辛い（からい）" },
        { en: "light (weight)", jp: "軽い（かるい）" },
        { en: "cute", jp: "可愛い（かわいい）" },
        { en: "yellow", jp: "黄色い（きいろい）" },
        { en: "dirty", jp: "汚い（きたない）" },
        { en: "dark", jp: "暗い（くらい）" },
        { en: "black", jp: "黒い（くろい）" },
        { en: "round", jp: "丸い（まるい）" },
        { en: "unpleasant (taste)", jp: "不味い（まずい）" },
        { en: "short (length)", jp: "短い（みじかい）" },
        { en: "difficult", jp: "難しい（むずかしい）" },
        { en: "long", jp: "長い（ながい）" },
        { en: "lukewarm", jp: "温い（ぬるい）" },
        { en: "delicious", jp: "美味しい（おいしい）" },
        { en: "heavy", jp: "重い（おもい）" },
        { en: "interesting", jp: "面白い（おもしろい）" },
        { en: "many/numerous", jp: "多い（おおい）" },
        { en: "big", jp: "大きい（おおきい）" },
        { en: "slow/late", jp: "遅い（おそい）" },
        { en: "cold (weather)", jp: "寒い（さむい）" },
        { en: "narrow", jp: "狭い（せまい）" },
        { en: "white", jp: "白い（しろい）" },
        { en: "few/little", jp: "少ない（すくない）" },
        { en: "cool/refreshing", jp: "涼しい（すずしい）" },
        { en: "high/expensive", jp: "高い（たかい）" },
        { en: "enjoyable/fun", jp: "楽しい（たのしい）" },
        { en: "far", jp: "遠い（とおい）" },
        { en: "boring", jp: "詰まらない（つまらない）" },
        { en: "cold (to touch)", jp: "冷たい（つめたい）" },
        { en: "strong/powerful", jp: "強い（つよい）" },
        { en: "noisy/annoying", jp: "煩い（うるさい）" },
        { en: "thin/weak", jp: "薄い（うすい）" },
        { en: "young", jp: "若い（わかい）" },
        { en: "bad", jp: "悪い（わるい）" },
        { en: "easy", jp: "易しい（やさしい）" },
        { en: "cheap", jp: "安い（やすい）" },
        { en: "good", jp: "良い（よい）" },
        { en: "weak", jp: "弱い（よわい）" },

        // な-adjectives
        { en: "convenient/useful", jp: "便利（べんり）" },
        { en: "OK/alright", jp: "大丈夫（だいじょうぶ）" },
        { en: "love/like very much", jp: "大好き（だいすき）" },
        { en: "lively/healthy", jp: "元気（げんき）" },
        { en: "unskillful/poor at", jp: "下手（へた）" },
        { en: "free time", jp: "暇（ひま）" },
        { en: "truth/reality", jp: "本当（ほんとう）" },
        { en: "various", jp: "色々（いろいろ）" },
        { en: "unpleasant", jp: "嫌（いや）" },
        { en: "strong/durable", jp: "丈夫（じょうぶ）" },
        { en: "skillful/good at", jp: "上手（じょうず）" },
        { en: "splendid/enough", jp: "結構（けっこう）" },
        { en: "hate/dislike", jp: "嫌い（きらい）" },
        { en: "pretty/beautiful", jp: "綺麗（きれい）" },
        { en: "straight ahead", jp: "真っ直ぐ（まっすぐ）" },
        { en: "bustling/busy", jp: "賑やか（にぎやか）" },
        { en: "splendid", jp: "立派（りっぱ）" },
        { en: "quiet", jp: "静か（しずか）" },
        { en: "like", jp: "好き（すき）" },
        { en: "perhaps/probably", jp: "多分（たぶん）" },
        { en: "very/greatly", jp: "大変（たいへん）" },
        { en: "important/beloved", jp: "大切（たいせつ）" },
        { en: "many", jp: "沢山（たくさん）" },
        { en: "famous", jp: "有名（ゆうめい）" },
      ];

      let QUESTIONS_PER_GAME = 20; // now variable, set by start-screen buttons

      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionJpEl = document.getElementById("questionJp");
      const answersEl = document.getElementById("answers");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function speakWord(text, lang) {
        window.speechSynthesis.cancel(); // stop any word still being read
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
      }
      function startGame() {
        questions = shuffle(VERB_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;
        questionJpEl.textContent = q.en;
        speakWord(q.en, "en-GB");

        const distractorPool = VERB_BANK.filter((v) => v.en !== q.en);
        const distractors = shuffle(distractorPool).slice(0, 2);
        const options = shuffle([q, ...distractors]);

        answersEl.innerHTML = "";
        options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt.jp;
          btn.addEventListener("click", () => handleAnswer(opt, q, btn));
          answersEl.appendChild(btn);
        });
      }

      function handleAnswer(selected, correctQ, clickedBtn) {
        const allBtns = answersEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrect = selected.en === correctQ.en;

        allBtns.forEach((b) => {
          if (b.textContent === correctQ.jp) {
            b.classList.add("correct");
          } else if (b === clickedBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrect) {
          score++;
        } else {
          wrongAnswers.push({
            jp: correctQ.jp,
            correct: correctQ.en,
            chosen: selected.en,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }
      document
        .getElementById("resetProgressBtn")
        .addEventListener("click", () => {
          if (confirm("Clear all mastered words and start fresh?")) {
            masteredWords.clear();
            saveMastered(masteredWords);
          }
        });
      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const jpSpan = document.createElement("span");
            jpSpan.className = "jp";
            jpSpan.textContent = w.jp;
            const enSpan = document.createElement("span");
            enSpan.className = "en";
            enSpan.textContent = w.correct;
            li.appendChild(jpSpan);
            li.appendChild(enSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME =
            btn.dataset.count === "all"
              ? ADJ_BANK.length
              : parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
