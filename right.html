    <title>Right or Wrong? Grammar Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />

      rel="stylesheet"

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Comic Neue", "Chalkboard SE", "Chalkboard", "Comic Sans MS",
          "Segoe Print", sans-serif;
        --colour-btn-face: blue;
        --colour-btn-active: blue;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-correct: #4caf50;
        --colour-wrong: #e53935;
        --colour-dim: #f0f0f0;
        --colour-right-btn: #dff5e1;
        --colour-wrong-btn: #fde1e1;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: blue;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: lightskyblue;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
        font-size: clamp(1.4rem, 7vw, 3rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.2rem, 5.5vw, 1.9rem);
        text-align: center;
      }

      .start-sub {
        color: white;
        opacity: 0.9;
        font-size: clamp(0.85rem, 3.6vw, 1.1rem);
        text-align: center;
        max-width: 420px;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 1.2em 1.2em;
        margin-bottom: 4vh;
        text-align: center;
        width: 100%;
        max-width: 560px;
      }
      .question-label {
        font-family: var(--font-chalk);
        font-size: clamp(0.75rem, 3vw, 0.95rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #999;
        margin-bottom: 0.5em;
      }
      .question-sentence {
        font-size: clamp(1.3rem, 6vw, 2.1rem);
        color: #222;
        font-family: var(--font-chalk);
        line-height: 1.4;
      }

      .answers {
        display: flex;
        flex-direction: row;
        gap: clamp(12px, 4vw, 24px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
        font-size: clamp(1.1rem, 6vw, 2rem);
        height: clamp(60px, 12vh, 100px);
        padding: 0 0.6em;
      }
      .answers .btn {
        flex-direction: column;
        gap: 0.15em;
      }
      .answers .btn-right {
        background: var(--colour-right-btn);
      }
      .answers .btn-wrong {
        background: var(--colour-wrong-btn);
      }
      .btn .icon {
        font-size: 1.4em;
        line-height: 1;
      }
      .btn .label {
        font-size: 0.55em;
        letter-spacing: 0.05em;
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

      /* RESULTS SCREEN */
      .results-wrapper {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
        overflow-y: auto;
      }

      .score {
        color: white;
        -webkit-text-stroke: 1.5px darkorange;
        font-size: clamp(2rem, 10vw, 4rem);
        text-align: center;
        margin-bottom: 0.3em;
      }

      .score-sub {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

      .mistakes-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.7em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        font-size: clamp(0.9rem, 3.6vw, 1.15rem);
      }

      .mistakes-list .sentence {
        font-weight: bold;
      }

      .mistakes-list .verdict {
        color: var(--colour-wrong);
        font-weight: bold;
      }
      .mistakes-list .verdict.was-right {
        color: var(--colour-correct);
      }

      .play-again {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        transition: transform 0.1s ease;
      }
      .play-again:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE IPHONE - ask to rotate */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        h1,
        .progress,
        .start-wrapper,
        .game-wrapper,
        .results-wrapper,
        .back-btn {
          display: none;
        }
      }

      /* PORTRAIT IPHONE tweaks */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 8vw, 2.1rem) !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }
        .game-wrapper {
          padding: 1vh 6vw 3vh;
        }
        .question-card {
          margin-bottom: 3vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <a class="back-btn" href="grammar.html">← Back</a>
    <h1>Right or Wrong?</h1>
    <div class="progress" id="progress" style="display: none">
      Question 1 / 20
    </div>

    <div class="start-wrapper" id="startWrapper">
      <div class="start-title">Grammar Check</div>
      <div class="start-sub">
        Read each sentence. Is the grammar right or wrong?
      </div>
      <div class="start-buttons">
        <button class="btn" data-count="20">20</button>
        <button class="btn" data-count="30">30</button>
        <button class="btn" data-count="40">40</button>
      </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none">
      <div class="question-card">
        <div class="question-label">Is this sentence correct?</div>
        <div class="question-sentence" id="questionSentence"></div>
      </div>
      <div class="answers" id="answers">
        <button class="btn btn-right" id="rightBtn">
          <span class="icon">✓</span><span class="label">RIGHT</span>
        </button>
        <button class="btn btn-wrong" id="wrongBtn">
          <span class="icon">✗</span><span class="label">WRONG</span>
        </button>
      </div>
    </div>

    <div class="results-wrapper" id="resultsWrapper" style="display: none">
      <div class="score" id="score"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="mistakes-title" id="mistakesTitle" style="display: none">
        Sentences to review
      </div>
      <ul class="mistakes-list" id="mistakesList"></ul>
      <button class="play-again" id="playAgainBtn">Play Again</button>
    </div>

    <script>
      // ---- Grammar bank: sentence + isCorrect (based on A2 Grammar List) ----
      // 150 grammatically correct sentences + 150 grammatically incorrect sentences
      const GRAMMAR_BANK = [
        // 1. ちゃいけない - must not do (spoken)
        { text: "ここでは写真を撮っちゃいけない。", correct: true },
        { text: "ここでは写真を撮るちゃいけない。", correct: false },

        // 2. だ・です - to be
        { text: "明日は休みです。", correct: true },
        { text: "明日は休みだです。", correct: false },

        // 3. だけ - only
        { text: "テストに一つだけ質問があります。", correct: true },
        { text: "テストにだけ一つ質問があります。", correct: false },

        // 4. だろう - probably (plain)
        { text: "彼はもう寝ているだろう。", correct: true },
        { text: "彼はもう寝ていますだろう。", correct: false },

        // 5. で - in/at/on/by/with/via
        { text: "駅で友達に会いました。", correct: true },
        { text: "駅を友達に会いました。", correct: false },

        // 6. でも - but/however
        { text: "疲れました。でも、頑張ります。", correct: true },
        { text: "疲れました。でも頑張りますでした。", correct: false },

        // 7. でしょう - probably (polite)
        { text: "来週は忙しいでしょう。", correct: true },
        { text: "来週は忙しいますでしょう。", correct: false },

        // 8. どんな - what kind of
        { text: "どんなスポーツが好きですか。", correct: true },
        { text: "どんなのスポーツが好きですか。", correct: false },

        // 9. どうして - why
        { text: "どうして日本語を勉強していますか。", correct: true },
        { text: "どうしてを日本語を勉強していますか。", correct: false },

        // 10. どうやって - how
        { text: "どうやって漢字を覚えますか。", correct: true },
        { text: "どうやってに漢字を覚えますか。", correct: false },

        // 11. が - subject marker
        { text: "だれが来ましたか。", correct: true },
        { text: "だれを来ましたか。", correct: false },

        // 12. があります - there is (things)
        { text: "机の上に本があります。", correct: true },
        { text: "机の上に本がいます。", correct: false },

        // 13. がほしい - to want something
        { text: "新しい靴がほしい。", correct: true },
        { text: "新しい靴をほしい。", correct: false },

        // 14. がいます - there is (living things)
        { text: "公園に子供がいます。", correct: true },
        { text: "公園に子供があります。", correct: false },

        // 15. ほうがいい - had better
        { text: "薬を飲んだほうがいいです。", correct: true },
        { text: "薬を飲むほうがいいでした。", correct: false },

        // 16. い-adjectives
        { text: "「大きい」はい-adjectiveです。", correct: true },
        { text: "「大きい」はな-adjectiveです。", correct: false },

        // 17. 一番 - the most
        { text: "クラスで彼女が一番頭がいいです。", correct: true },
        { text: "クラスで彼女は一番の頭がいいです。", correct: false },

        // 18. 一緒に - together
        { text: "週末、家族と一緒に旅行します。", correct: true },
        { text: "週末、家族と一緒旅行します。", correct: false },

        // 19. いつも - always
        { text: "父はいつも朝早く起きます。", correct: true },
        { text: "父はいつもの朝早く起きます。", correct: false },

        // 20. じゃない - to not be
        { text: "これはペンじゃない。", correct: true },
        { text: "これはペンじゃないだ。", correct: false },

        // 21. か - question particle
        { text: "明日は雨ですか。", correct: true },
        { text: "明日は雨かです。", correct: false },

        // 22. か～か - or
        { text: "電車かバスか、どちらで行きますか。", correct: true },
        { text: "電車やバスか、どちらで行きますか。", correct: false },

        // 23. から - because/since/from
        { text: "眠いから、早く寝ます。", correct: true },
        { text: "眠いのでから、早く寝ます。", correct: false },

        // 24. 方 - way of doing
        { text: "この漢字の読み方が分かりません。", correct: true },
        { text: "この漢字の読むほうが分かりません。", correct: false },

        // 25. けど - but (casual)
        { text: "食べたいけど、お金がありません。", correct: true },
        { text: "食べたいだけど、お金がありません。", correct: false },

        // 26. けれども - but (formal)
        { text: "この部屋は狭いけれども、静かです。", correct: true },
        { text: "この部屋は狭いだけれども、静かです。", correct: false },

        // 27. まだ - still/not yet
        { text: "宿題はまだ終わっていません。", correct: true },
        { text: "宿題はまだ終わっていましたません。", correct: false },

        // 28. まだ～ていません - have not yet
        { text: "彼女はまだ手紙を書いていません。", correct: true },
        { text: "彼女はまだ手紙を書いませんでいません。", correct: false },

        // 29. まで - until/as far as
        { text: "図書館は九時まで開いています。", correct: true },
        { text: "図書館は九時のまで開いています。", correct: false },

        // 30. 前に - before
        { text: "寝る前に、歯を磨きます。", correct: true },
        { text: "寝る前で、歯を磨きます。", correct: false },

        // 31. ませんか - would you / shall we
        { text: "一緒に映画を見ませんか。", correct: true },
        { text: "一緒に映画を見ましたませんか。", correct: false },

        // 32. ましょう - let's
        { text: "もう遅いので、帰りましょう。", correct: true },
        { text: "もう遅いので、帰るましょう。", correct: false },

        // 33. ましょうか - shall I
        { text: "荷物を持ちましょうか。", correct: true },
        { text: "荷物を持つましょうか。", correct: false },

        // 34. も - too/also
        { text: "私はコーヒーが好きです。紅茶も好きです。", correct: true },
        { text: "私はコーヒーが好きです。紅茶はも好きです。", correct: false },

        // 35. もう - already
        { text: "宿題はもう終わりました。", correct: true },
        { text: "宿題はもう終わりますでした。", correct: false },

        // 36. な-adjectives
        { text: "「静か」はな-adjectiveです。", correct: true },
        { text: "「静か」はい-adjectiveです。", correct: false },

        // 37. なあ - confirmation/admiration
        { text: "きれいな景色だなあ。", correct: true },
        { text: "きれいな景色ですなあ。", correct: false },

        // 38. ないで - without doing
        { text: "傘を持たないで出かけました。", correct: true },
        { text: "傘を持ちないで出かけました。", correct: false },

        // 39. ないでください - please don't do
        { text: "ここに車を止めないでください。", correct: true },
        { text: "ここに車を止まないでください。", correct: false },

        // 40. ないといけない - must do
        { text: "薬を飲まないといけない。", correct: true },
        { text: "薬を飲まといけない。", correct: false },

        // 41. なくてもいい - don't have to
        { text: "今日は仕事をしなくてもいいです。", correct: true },
        { text: "今日は仕事をしないもいいです。", correct: false },

        // 42. なくちゃ - gotta do (casual)
        { text: "もう帰らなくちゃ。", correct: true },
        { text: "もう帰るなくちゃ。", correct: false },

        // 43. なくてはいけない - must do
        { text: "レポートを書かなくてはいけない。", correct: true },
        { text: "レポートを書くなくてはいけない。", correct: false },

        // 44. なくてはならない - must do
        { text: "規則を守らなくてはならない。", correct: true },
        { text: "規則を守るなくてはならない。", correct: false },

        // 45. なる - to become
        { text: "寒くなってきました。", correct: true },
        { text: "寒いなってきました。", correct: false },

        // 46. んです - to explain/emphasize
        { text: "どうして遅れたんですか。", correct: true },
        { text: "どうして遅れたのんですか。", correct: false },

        // 47. ね - isn't it? right?
        { text: "今日はいい天気ですね。", correct: true },
        { text: "今日はいい天気ですねか。", correct: false },

        // 48. に - destination/time particle
        { text: "明日、東京に行きます。", correct: true },
        { text: "明日、東京へを行きます。", correct: false },

        // 49. にいく - go to do
        { text: "映画を見にいく。", correct: true },
        { text: "映画を見るにいく。", correct: false },

        // 50. にする - to decide on
        { text: "飲み物は紅茶にする。", correct: true },
        { text: "飲み物は紅茶がする。", correct: false },

        // 51. に/へ - to (direction)
        { text: "北海道へ旅行します。", correct: true },
        { text: "北海道と旅行します。", correct: false },

        // 52. の - possessive particle
        { text: "これは私の本です。", correct: true },
        { text: "これは私が本です。", correct: false },

        // 53. のです - to explain/emphasize
        { text: "電車が遅れたのです。", correct: true },
        { text: "電車が遅れただのです。", correct: false },

        // 54. のが下手 - to be bad at
        { text: "私は歌うのが下手です。", correct: true },
        { text: "私は歌のが下手です。", correct: false },

        // 55. のが上手 - to be good at
        { text: "彼はテニスをするのが上手です。", correct: true },
        { text: "彼はテニスをしますのが上手です。", correct: false },

        // 56. のが好き - to like doing something
        { text: "私は本を読むのが好きです。", correct: true },
        { text: "私は本を読みますのが好きです。", correct: false },

        // 57. の中で[A]が一番 - out of this group, A is best
        { text: "スポーツの中でサッカーが一番好きです。", correct: true },
        { text: "スポーツが中でサッカーが一番好きです。", correct: false },

        // 58. ので - because of/since
        { text: "疲れたので、早く寝ます。", correct: true },
        { text: "疲れなので、早く寝ます。", correct: false },

        // 59. お / ご - polite/honorific prefix
        { text: "お名前を教えてください。", correct: true },
        { text: "ご名前を教えてください。", correct: false },

        // 60. を - object marker
        { text: "パンを食べます。", correct: true },
        { text: "パンが食べます。", correct: false },

        // 61. をください - please give me
        { text: "水をください。", correct: true },
        { text: "水にください。", correct: false },

        // 62. しかし - but/however
        { text: "頑張りました。しかし、負けました。", correct: true },
        { text: "頑張りました。しかしので、負けました。", correct: false },

        // 63. それから - and then/after that
        { text: "宿題をしました。それから、テレビを見ました。", correct: true },
        {
          text: "宿題をしました。それからに、テレビを見ました。",
          correct: false,
        },

        // 64. そして - and then/thus
        {
          text: "朝ご飯を食べました。そして、学校へ行きました。",
          correct: true,
        },
        {
          text: "朝ご飯を食べました。そしてが、学校へ行きました。",
          correct: false,
        },

        // 65. すぎる - too much
        { text: "このケーキは甘すぎる。", correct: true },
        { text: "このケーキは甘いすぎる。", correct: false },

        // 66. たことがある - to have done something before
        { text: "京都へ行ったことがある。", correct: true },
        { text: "京都へ行っただことがある。", correct: false },

        // 67. たい - want to do
        { text: "水が飲みたい。", correct: true },
        { text: "水を飲むたい。", correct: false },

        // 68. たり～たり - do such things as A and B
        { text: "週末は掃除をしたり、買い物をしたりします。", correct: true },
        {
          text: "週末は掃除をしってたり、買い物をしたりします。",
          correct: false,
        },

        // 69. てある - is/has been done (resulting state)
        { text: "壁に絵が掛けてある。", correct: true },
        { text: "壁に絵を掛けてある。", correct: false },

        // 70. ている - ongoing action/current state
        { text: "今、雨が降っている。", correct: true },
        { text: "今、雨が降るている。", correct: false },

        // 71. てから - after doing
        { text: "手を洗ってから、食べます。", correct: true },
        { text: "手を洗ってがから、食べます。", correct: false },

        // 72. てください - please do
        { text: "ここに名前を書いてください。", correct: true },
        { text: "ここに名前を書くください。", correct: false },

        // 73. てはいけない - must not
        { text: "ここで走ってはいけない。", correct: true },
        { text: "ここで走るはいけない。", correct: false },

        // 74. てもいいです - is OK to
        { text: "写真を撮ってもいいですか。", correct: true },
        { text: "写真を撮るもいいですか。", correct: false },

        // 75. と - and/with/as
        { text: "友達と映画を見ます。", correct: true },
        { text: "友達に映画を見ます。", correct: false },

        // 76. とき - when
        { text: "日本へ行くとき、パスポートが必要です。", correct: true },
        { text: "日本へ行きとき、パスポートが必要です。", correct: false },

        // 77. とても - very
        { text: "この本はとても面白いです。", correct: true },
        { text: "この本はとてもの面白いです。", correct: false },

        // 78. つもり - plan to/intend to
        { text: "来年、留学するつもりです。", correct: true },
        { text: "来年、留学しますつもりです。", correct: false },

        // 79. は - topic marker
        { text: "私は学生です。", correct: true },
        { text: "私を学生です。", correct: false },

        // 80. は〜より・・・です - A is more ~ than B
        { text: "象はねずみより大きいです。", correct: true },
        { text: "象はねずみのより大きいです。", correct: false },

        // 81. はどうですか - how about
        { text: "コーヒーはどうですか。", correct: true },
        { text: "コーヒーがどうですか。", correct: false },

        // 82. や - and/or (partial listing)
        { text: "机の上に本やペンがあります。", correct: true },
        { text: "机の上に本にペンがあります。", correct: false },

        // 83. よ - emphasis (ending particle)
        { text: "もうすぐ電車が来ますよ。", correct: true },
        { text: "もうすぐ電車が来ますよか。", correct: false },

        // 84. より～ほうが - A is more than B
        { text: "電車よりバスのほうが速いです。", correct: true },
        { text: "電車よりバスがほうが速いです。", correct: false },
      ];

      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionSentenceEl = document.getElementById("questionSentence");
      const rightBtn = document.getElementById("rightBtn");
      const wrongBtn = document.getElementById("wrongBtn");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame() {
        questions = shuffle(GRAMMAR_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;
        questionSentenceEl.textContent = q.text;

        rightBtn.disabled = false;
        wrongBtn.disabled = false;
        rightBtn.classList.remove("correct", "wrong", "dim");
        wrongBtn.classList.remove("correct", "wrong", "dim");
      }

      function handleAnswer(userSaysRight) {
        rightBtn.disabled = true;
        wrongBtn.disabled = true;

        const q = questions[currentIndex];
        const isCorrectAnswer = userSaysRight === q.correct;
        const chosenBtn = userSaysRight ? rightBtn : wrongBtn;
        const otherBtn = userSaysRight ? wrongBtn : rightBtn;
        const trueBtn = q.correct ? rightBtn : wrongBtn;

        if (isCorrectAnswer) {
          chosenBtn.classList.add("correct");
          otherBtn.classList.add("dim");
        } else {
          chosenBtn.classList.add("wrong");
          trueBtn.classList.add("correct");
        }

        if (isCorrectAnswer) {
          score++;
        } else {
          wrongAnswers.push({
            text: q.text,
            wasCorrect: q.correct,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }

      rightBtn.addEventListener("click", () => handleAnswer(true));
      wrongBtn.addEventListener("click", () => handleAnswer(false));

      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const sentSpan = document.createElement("span");
            sentSpan.className = "sentence";
            sentSpan.textContent = w.text;
            const verdictSpan = document.createElement("span");
            verdictSpan.className =
              "verdict" + (w.wasCorrect ? " was-right" : "");
            verdictSpan.textContent = w.wasCorrect
              ? "This sentence was RIGHT"
              : "This sentence was WRONG";
            li.appendChild(sentSpan);
            li.appendChild(verdictSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
</html>
